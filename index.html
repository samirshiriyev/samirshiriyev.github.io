<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İnsan Anatomiyası | Canlı 3D Atlas</title>
<style>
:root{color-scheme:dark;--bg:#07090e;--panel:rgba(20,24,33,.85);--line:rgba(255,255,255,.12);--txt:#f1f5f9;--mut:#94a3b8;--acc:#38bdf8}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;top:12px;left:16px;right:16px;padding:12px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);font-size:14px;font-weight:600;z-index:2;box-shadow:0 10px 25px rgba(0,0,0,.5)}
header small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:2px}
#regions{position:fixed;right:16px;top:84px;width:220px;display:flex;flex-direction:column;gap:8px;z-index:2}
#regions h3{margin:0 0 2px;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase}
.reg{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font-size:13px;text-align:left;cursor:pointer;backdrop-filter:blur(10px);transition:.2s}
.reg:hover{border-color:var(--acc)}
.reg.on,.lay.on{border-color:var(--acc);background:rgba(56,189,248,.25)}
.lay{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:8px 12px;font-size:12px;text-align:left;cursor:pointer;backdrop-filter:blur(10px);white-space:nowrap}.lay.on{color:var(--txt)}
#ctrl{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:min(560px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;z-index:2;backdrop-filter:blur(10px);box-shadow:0 10px 25px rgba(0,0,0,.5)}
#views{display:flex;gap:6px;margin-bottom:8px}
.v{flex:1;background:transparent;border:1px solid var(--line);color:var(--mut);padding:6px;border-radius:8px;font-size:12px;cursor:pointer}
.v.on{background:rgba(255,255,255,.15);color:var(--txt)}
.row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
#reset{background:var(--acc);color:#0f172a;border:0;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
input[type=range]{flex:1;accent-color:var(--acc);height:24px}
#label{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;width:min(560px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:14px;font-size:13px;line-height:1.5;display:none;z-index:3;backdrop-filter:blur(10px)}
#label b{font-size:15px;color:var(--acc)}
#label small{display:block;color:var(--mut);font-size:11px;margin:2px 0 6px}
#side{position:fixed;left:16px;top:84px;bottom:140px;width:240px;display:flex;flex-direction:column;gap:8px;z-index:2;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;backdrop-filter:blur(10px)}
#q{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--txt);font-size:13px;outline:none}
#list{overflow:auto;flex:1}
.it{padding:8px;border-radius:8px;font-size:13px;cursor:pointer}.it small{display:block;color:var(--mut);font-size:11px}.it:hover,.it.on{background:rgba(56,189,248,.2)}
.tgm{display:none}
@media(max-width:700px){
#regions{left:16px;right:16px;width:auto;flex-direction:row;overflow-x:auto;top:70px}
#regions h3{display:none}.reg{white-space:nowrap;padding:8px 12px}
#side{display:none;left:16px;right:16px;width:auto;top:120px}#side.open{display:flex}.tgm{display:block}
}
</style>
</head>
<body>
<header>İnsan Anatomiyası | Canlı 3D Atlas<small>Fırlat = Sol düyməni sıx · Yaxınlaşdır = Mouse çarkı · Orqanı seç = Kliklə</small></header>
<div id="side"><input id="q" placeholder="Orqan axtar…"><div id="list"></div></div><div id="label"></div>
<div id="regions"><h3>Bölgələr</h3></div>
<div id="ctrl">
<div id="views"></div>
<div class="row"><span>Orqanları aralamaq (Zoom/Açıqlıq)</span><input id="ex" type="range" min="0" max="100" value="0"><button id="reset">Sıfırla</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07090e);
scene.fog=new THREE.Fog(0x07090e,8,18);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const cam=new THREE.PerspectiveCamera(40,1,.1,50);
scene.add(new THREE.HemisphereLight(0xffffff,0x334155,1));
const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(4,6,6);scene.add(dl);
const dl2=new THREE.DirectionalLight(0x38bdf8,.5);dl2.position.set(-4,2,-4);scene.add(dl2);

const parts=[],V3=(x,y,z)=>new THREE.Vector3(x,y,z),BONE=0xf1f5f9;
const mat=(c,op=1)=>new THREE.MeshStandardMaterial({color:c,roughness:.4,metalness:.1,transparent:true,opacity:op});
function put(o,name,region,pos,sub){o.position.copy(pos);o.userData={name,region,sub:sub||'',base:pos.clone()};scene.add(o);parts.push(o);return o}
function ell(name,region,c,pos,sc,sub){const m=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),mat(c));m.scale.set(...sc);return put(m,name,region,pos,sub)}
function bone(name,region,a,b,r,sub){
  const d=b.clone().sub(a),L=d.length(),g=new THREE.Group();
  const q=new THREE.Quaternion().setFromUnitVectors(V3(0,1,0),d.clone().normalize());
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.1,L,16),mat(BONE));cyl.quaternion.copy(q);g.add(cyl);
  [-.5,.5].forEach(s=>{const k=new THREE.Mesh(new THREE.SphereGeometry(r*1.6,14,12),mat(BONE));k.position.copy(d.clone().multiplyScalar(s));g.add(k)});
  return put(g,name,region,a.clone().add(b).multiplyScalar(.5),sub)}

const KH='Baş və Boyun',BR='Döş Qəfəsi',BB='Qarın və Çanaq',GL='Ətraflar';
const lungs=[];
const MU=[['Döş əzələsi','Musculus pectoralis',BR,.2,2.25,.31,.2,.13,.04],['Çiyin əzələsi','Musculus deltoideus',GL,.58,2.4,0,.1,.16,.1],['Pazı əzələsi (Biseps)','Musculus biceps',GL,.6,2.1,.07,.055,.25,.05],['Qarın əzələsi','Musculus rectus abdominis',BB,.07,1.25,.24,.07,.28,.035],['Bud əzələsi','Musculus quadriceps',GL,.28,.3,.08,.09,.45,.08],['Baldır əzələsi','Musculus gastrocnemius',GL,.3,-.7,-.05,.07,.28,.06]];

// İnsan Skeleti və Orqanlarının Yerləşməsi
ell('Kəllə sümüyü',KH,BONE,V3(0,3.2,0),[.32,.36,.36],'Os craniale');
ell('Baş beyin',KH,0xf472b6,V3(0,3.22,0),[.26,.28,.28],'Cerebrum');
const tr=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.5,12),mat(0x94a3b8));put(tr,'Traxeya',KH,V3(0,2.45,.1),'Trachea');

for(let i=0;i<24;i++){
  const yy=i<7?2.82-i*.055:i<19?2.42-(i-7)*.078:1.46-(i-19)*.09;
  const z=-.1+.07*Math.sin((yy-1)*1.7);
  const reg=i<7?KH:i<19?BR:BB;
  const n=i<7?'Boyun fəqərəsi':i<19?'Döş fəqərəsi':'Bel fəqərəsi';
  const m=new THREE.Mesh(new THREE.CylinderGeometry(.06,.065,.05,14),mat(BONE));
  put(m,n,reg,V3(0,yy,z),'Vertebra')}

for(let i=0;i<12;i++){
  const r=.2+.17*Math.sin(((i+1)/12)*Math.PI*.9),arc=Math.PI*1.7;
  const g=new THREE.TorusGeometry(r,.015,8,44,arc);g.rotateZ(-Math.PI/2-arc/2);
  const m=new THREE.Mesh(g,mat(BONE));m.rotation.x=Math.PI/2;m.scale.set(1.15,.85,1);
  put(m,'Qabırğa',BR,V3(0,2.4-i*.085,.02),'Costae')}

[-1,1].forEach(s=>{
  bone('Bazu sümüyü',GL,V3(s*.54,2.46,0),V3(s*.62,1.78,0),.035,'Humerus');
  bone('Şüa sümüyü',GL,V3(s*.62,1.76,.02),V3(s*.7,1.12,.1),.025,'Radius');
  bone('Bud sümüyü',GL,V3(s*.24,.78,0),V3(s*.3,-.2,.02),.05,'Femur');
  bone('Qamış sümüyü',GL,V3(s*.3,-.3,.02),V3(s*.3,-1.32,0),.04,'Tibia');
  lungs.push(ell('Ağciyər',BR,0xf87171,V3(s*.2,2.1,.02),[.16,.3,.15],'Pulmo'));
  ell('Böyrək',BB,0x991b1b,V3(s*.15,1.38,-.1),[.06,.09,.05],'Ren')});

const heart=ell('Ürək',BR,0xef4444,V3(.08,2.0,.14),[.11,.14,.1],'Cor');
ell('Qaraciyər',BB,0xb91c1c,V3(-.16,1.6,.12),[.22,.1,.12],'Hepar');
ell('Mədə',BB,0xfca5a5,V3(.15,1.56,.13),[.11,.12,.09],'Gaster');
const si=new THREE.Mesh(new THREE.TorusKnotGeometry(.11,.04,100,10,3,4),mat(0xfecaca));si.scale.set(1,.8,.8);put(si,'Nazik bağırsaq',BB,V3(0,1.1,.1),'Intestinum tenue');
const co=new THREE.Mesh(new THREE.TorusGeometry(.21,.038,12,40),mat(0xfca5a5));put(co,'Yoğun bağırsaq',BB,V3(0,1.12,.06),'Colon');
ell('Sidik kisəsi',BB,0xfde047,V3(0,.76,.12),[.07,.07,.07],'Vesica urinaria');

MU.forEach(m=>ell(m[0],m[2],0x7f1d1d,V3(s*m[3],m[4],m[5]),[m[6],m[7],m[8]],m[1]).userData.mo=.45);

// Xarici Şəffaf Dəri Silueti (Canlı İnsan Görünüşü Üçün)
const skin=new THREE.Mesh(new THREE.CylinderGeometry(.62,.35,3.8,32),mat(0x38bdf8,.08));
skin.position.set(0,1.6,0);put(skin,'Xarici Dəri',KH,V3(0,1.6,0),'Skin');

// Regionlar və İdarəetmə
const C0=V3(0,1.6,0),FOC={all:1.3,[KH]:3.0,[BR]:2.1,[BB]:1.1,[GL]:1.3};
let region=null,sel=null;const fT=V3(0,1.3,0),fC=V3(0,1.3,0);
const rbox=document.getElementById('regions');
[KH,BR,BB,GL].forEach(r=>{const b=document.createElement('button');b.className='reg';b.textContent=r;b.onclick=()=>{region=region===r?null:r;follow=false;fT.set(0,FOC[region||'all'],0);dist.t=region?4.6:7.6;document.querySelectorAll('.reg').forEach(x=>x.classList.toggle('on',x.textContent===region))};rbox.append(b)});

const show={b:1,o:1,v:1,n:1,m:1};
function mk(t,f,c){const b=document.createElement('button');b.className='reg '+(c||'');b.textContent=t;b.onclick=()=>f(b);rbox.append(b)}
mk('Bütün Bədən',()=>{region=null;follow=false;fT.set(0,1.3,0);dist.t=7.6;if(sel)setEm(sel,0);sel=null;lab.style.display='none';document.querySelectorAll('.reg').forEach(x=>x.classList.remove('on'))});
[['Skelet','b'],['Orqanlar','o'],['Əzələlər','m']].forEach(([t,k])=>{const b=document.createElement('button');b.className='lay'+(show[k]?' on':'');b.textContent=t;b.onclick=()=>{show[k]=show[k]?0:1;b.classList.toggle('on',!!show[k])};rbox.append(b)});

mk('☰ Orqan siyahısı',()=>side.classList.toggle('open'),'tgm');
const VIEWS={Ön:[0,Math.PI/2],Arxa:[Math.PI,Math.PI/2],Yan:[Math.PI/2,Math.PI/2],Perspektiv:[.7,1.25]};
const vb=document.getElementById('views');
Object.keys(VIEWS).forEach((k,i)=>{const b=document.createElement('button');b.className='v'+(i==3?' on':'');b.textContent=k;b.onclick=()=>{th.t=VIEWS[k][0];ph.t=VIEWS[k][1];[...vb.children].forEach(x=>x.classList.toggle('on',x===b))};vb.append(b)});

// Kamera və Hərəkət
const th={c:.7,t:.7},ph={c:1.25,t:1.25},dist={c:7.6,t:7.6};
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const cv=renderer.domElement;let drag=null,moved=0;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};moved+=Math.abs(dx)+Math.abs(dy);th.t-=dx*.008;th.c=th.t;ph.t=Math.min(Math.PI-.2,Math.max(.2,ph.t-dy*.008));ph.c=ph.t});
cv.addEventListener('pointerup',e=>{drag=null;if(moved<6)pick(e)});
cv.addEventListener('wheel',e=>{e.preventDefault();dist.t=Math.min(12,Math.max(2,dist.t+e.deltaY*.005))},{passive:false});

const ray=new THREE.Raycaster(),lab=document.getElementById('label');
function setEm(o,v){o.traverse(m=>{if(m.material)m.material.emissive=new THREE.Color(v)})}
function pick(e){
  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
  const hit=ray.intersectObjects(parts,true).find(h=>{let o=h.object;while(o&&!o.userData.name)o=o.parent;return o&&o.userData.sub!=='Skin'});
  if(sel)setEm(sel,0x000000);sel=null;lab.style.display='none';
  if(!hit)return;let o=hit.object;while(!o.userData.name)o=o.parent;
  select(o,true)}

const side=document.getElementById('side');let follow=false;
const ORG=new Set(['Cerebrum','Trachea','Pulmo','Ren','Cor','Hepar','Gaster','Intestinum tenue','Colon','Vesica urinaria']);
const INFO={
'Cerebrum':['Baş beyin','Düşüncə, yaddaş və sinir sisteminin idarəetmə mərkəzi.'],
'Pulmo':['Ağciyər','Oksigen mübadiləsini həyata keçirən tənəffüs orqanı.'],
'Cor':['Ürək','Qanı bütün bədənə pompalayan həyati əzələvi orqan.'],
'Hepar':['Qaraciyər','Orqanizmin əsas filtrasiya və maddələr mübadiləsi mərkəzi.'],
'Gaster':['Mədə','Qidaların ilkin həzm olunduğu orqan.'],
'Intestinum tenue':['Nazik bağırsaq','Qidaların qana sorulduğu əsas hissə.'],
'Ren':['Böyrək','Qanı süzərək sidik istehsal edən orqan.']
};

function select(o,fly){
  if(sel)setEm(sel,0);sel=o;setEm(o,0x38bdf8);
  const i=INFO[o.userData.sub]||[o.userData.name,'Canlı anatomik struktur'];
  lab.innerHTML='<b>'+i[0]+'</b><small>'+o.userData.name+' · '+o.userData.region+'</small>'+i[1];lab.style.display='block';
  if(fly){follow=true;fT.copy(o.position);dist.t=2.5;side.classList.remove('open')}}

const list=document.getElementById('list'),q=document.getElementById('q');
function build(f){list.innerHTML='';Object.keys(INFO).forEach(k=>{const p=parts.find(x=>x.userData.sub===k);if(!p)return;const d=document.createElement('div');d.className='it';d.innerHTML=INFO[k][0]+'<small>'+k+'</small>';d.onclick=()=>{select(p,true)};list.append(d)})}
q.oninput=()=>build(q.value.toLowerCase());build('');

const ex=document.getElementById('ex');let eT=0,eC=0;
ex.oninput=()=>eT=ex.value/100;
document.getElementById('reset').onclick=()=>{eT=0;ex.value=0};

function loop(){
  requestAnimationFrame(loop);
  eC+=(eT-eC)*.12;th.c+=(th.t-th.c)*.1;ph.c+=(ph.t-ph.c)*.1;dist.c+=(dist.t-dist.c)*.1;if(follow&&sel)fT.copy(sel.position);fC.lerp(fT,.08);
  
  // Avtomatik Zoom edəndə daxili orqanların dərindən üzə çıxması (Canlı effekt)
  if(dist.c < 4) { eT = Math.max(eT, 0.4); } 

  parts.forEach(o=>{
    const b=o.userData.base,d=b.clone().sub(C0);
    o.position.copy(b).addScaledVector(d,eC*1.2);
  });

  // Ürəyin döyünməsi və Ağciyərin nəfəs alması effekti
  const t=performance.now()/1000,k=1+.1*Math.pow(Math.max(0,Math.sin(t*7)),3),br=Math.sin(t*1.5);
  heart.scale.set(.11*k,.14*k,.1*k);
  lungs.forEach(l=>l.scale.set(.16*(1+.05*br),.3*(1+.08*br),.15*(1+.05*br)));

  cam.position.set(fC.x+dist.c*Math.sin(ph.c)*Math.sin(th.c),fC.y+dist.c*Math.cos(ph.c),fC.z+dist.c*Math.sin(ph.c)*Math.cos(th.c));
  cam.lookAt(fC);renderer.render(scene,cam)}
loop();
</script>
</body>
</html>
