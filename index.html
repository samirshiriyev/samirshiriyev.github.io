<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İnsan Anatomiyası | 3D İnteraktiv Atlas</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:rgba(30,33,42,.82);--line:rgba(255,255,255,.1);--txt:#e9ecf3;--mut:#8b92a5;--acc:#5b7cff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:14px 18px;font-size:14px;font-weight:600;pointer-events:none;z-index:2}
header small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:2px}
#regions{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 64px);width:210px;display:flex;flex-direction:column;gap:8px;z-index:2}
#regions h3{margin:0 0 2px;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.reg{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:14px;font-size:14px;text-align:left;cursor:pointer;backdrop-filter:blur(10px)}
.reg.on,.lay.on{border-color:var(--acc);background:rgba(91,124,255,.22)}
.lay{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:14px;padding:10px 14px;font-size:13px;text-align:left;cursor:pointer;backdrop-filter:blur(10px);white-space:nowrap}.lay.on{color:var(--txt)}
#ctrl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(560px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px;z-index:2;backdrop-filter:blur(10px)}
#views{display:flex;gap:6px;margin-bottom:10px}
.v{flex:1;background:transparent;border:1px solid var(--line);color:var(--mut);padding:8px 4px;border-radius:10px;font-size:13px;cursor:pointer}
.v.on{background:rgba(255,255,255,.14);color:var(--txt)}
.row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.row span{white-space:nowrap}
#reset{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
input[type=range]{flex:1;min-width:0;accent-color:var(--acc);height:28px}
#label{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 128px);width:min(560px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.5;display:none;z-index:3;backdrop-filter:blur(10px)}
#label b{font-size:16px}
#label small{display:block;color:var(--mut);font-size:11px;margin:2px 0 6px}
#side{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 64px);bottom:150px;width:230px;display:flex;flex-direction:column;gap:8px;z-index:2;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;backdrop-filter:blur(10px)}
#q{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--txt);font-size:13px}
#list{overflow:auto;flex:1}
.it{padding:8px 6px;border-radius:8px;font-size:13px;cursor:pointer}.it small{display:block;color:var(--mut);font-size:11px}.it:hover,.it.on{background:rgba(91,124,255,.22)}
.tgm{display:none}
@media(max-width:700px){
#regions{left:12px;right:12px;width:auto;flex-direction:row;overflow-x:auto;top:calc(env(safe-area-inset-top,0px) + 56px)}
#regions h3{display:none}.reg{white-space:nowrap;padding:10px 12px;font-size:13px}
#side{display:none;left:12px;right:12px;width:auto;top:calc(env(safe-area-inset-top,0px) + 108px)}#side.open{display:flex}.tgm{display:block}
}
</style>
</head>
<body>
<header>İnsan Anatomiyası | 3D İnteraktiv Atlas<small>Sürüşdür = fırlat · Çarx = yaxınlaşdır · Kliklə = struktur seç</small></header>
<div id="side"><input id="q" placeholder="Orqan axtar…"><div id="list"></div></div><div id="label"></div>
<div id="regions"><h3>Qatlar / Bölmələr</h3></div>
<div id="ctrl">
<div id="views"></div>
<div class="row"><span>Strukturları aralamaq</span><input id="ex" type="range" min="0" max="100" value="0"><button id="reset">Yenidən yığ</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0d12);
scene.fog=new THREE.Fog(0x0b0d12,9,16);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const cam=new THREE.PerspectiveCamera(40,1,.1,50);
scene.add(new THREE.HemisphereLight(0xdfe8ff,0x20242e,.9));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,5,6);scene.add(dl);
const dl2=new THREE.DirectionalLight(0x8899ff,.4);dl2.position.set(-4,2,-5);scene.add(dl2);

const parts=[],V3=(x,y,z)=>new THREE.Vector3(x,y,z),BONE=0xe9dfc4;
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.04,transparent:true,opacity:1});
function put(o,name,region,pos,sub){o.position.copy(pos);o.userData={name,region,sub:sub||'',base:pos.clone()};scene.add(o);parts.push(o);return o}
function ell(name,region,c,pos,sc,sub){const m=new THREE.Mesh(new THREE.SphereGeometry(1,28,20),mat(c));m.scale.set(...sc);return put(m,name,region,pos,sub)}
function bone(name,region,a,b,r,sub){
  const d=b.clone().sub(a),L=d.length(),g=new THREE.Group();
  const q=new THREE.Quaternion().setFromUnitVectors(V3(0,1,0),d.clone().normalize());
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.1,L,14),mat(BONE));cyl.quaternion.copy(q);g.add(cyl);
  [-.5,.5].forEach(s=>{const k=new THREE.Mesh(new THREE.SphereGeometry(r*1.7,14,12),mat(BONE));k.position.copy(d.clone().multiplyScalar(s));g.add(k)});
  return put(g,name,region,a.clone().add(b).multiplyScalar(.5),sub)}

const KH='Baş və Boyun',BR='Döş Qəfəsi',BB='Qarın və Çanaq',GL='Ətraflar';
const lungs=[];
const MU=[['Döş əzələsi (M. pectoralis major)','Musculus pectoralis',BR,.2,2.25,.31,.2,.13,.04],['Çiyin (delta) əzələsi (M. deltoideus)','Musculus deltoideus',GL,.58,2.4,0,.1,.16,.1],['Pazı (biseps) əzələsi (M. biceps brachii)','Musculus biceps',GL,.6,2.1,.07,.055,.25,.05],['Ön qol əzələləri','Musculi antebrachii',GL,.67,1.45,.06,.05,.3,.045],['Düz qarın əzələsi (M. rectus abdominis)','Musculus rectus abdominis',BB,.07,1.25,.24,.07,.28,.035],['Dördbaşlı bud əzələsi (M. quadriceps)','Musculus quadriceps',GL,.28,.3,.08,.09,.45,.08],['Baldır əzələsi (M. gastrocnemius)','Musculus gastrocnemius',GL,.3,-.7,-.05,.07,.28,.06],['Omba əzələsi (M. gluteus maximus)','Musculus gluteus',BB,.2,.75,-.15,.17,.15,.1],['Trapesiya əzələsi (M. trapezius)','Musculus trapezius',BR,.15,2.45,-.2,.17,.25,.03],['Geniş kürək əzələsi (M. latissimus dorsi)','Musculus latissimus',BR,.28,1.85,-.2,.15,.3,.03],['Döş-körpücük əzələsi (M. sternocleidomastoideus)','Musculus sternocleidomastoideus',KH,.1,2.7,.08,.04,.18,.04],['Çeynəmə əzələsi (M. masseter)','Musculus masseter',KH,.2,2.95,.2,.04,.09,.05]];
// Kopf
ell('Kəllə (Cranium)',KH,BONE,V3(0,3.2,0),[.34,.38,.38],'Os craniale');
ell('Alt çənə (Mandibula)',KH,BONE,V3(0,2.92,.14),[.22,.1,.2],'Mandibula');
ell('Baş beyin (Cerebrum)',KH,0xe3a0b0,V3(0,3.22,0),[.27,.3,.3],'Cerebrum');
const tr=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.55,12),mat(0xbfd3e6));put(tr,'Traxeya (Nəfəs borusu)',KH,V3(0,2.45,.1),'Trachea');
// Wirbelsäule
for(let i=0;i<24;i++){
  const y=2.78-i*.0535*(i<7?1:1)-(i>=7?0:0), yy=i<7?2.82-i*.055:i<19?2.42-(i-7)*.078:1.46-(i-19)*.09;
  const z=-.1+.07*Math.sin((yy-1)*1.7);
  const reg=i<7?KH:i<19?BR:BB;
  const n=i<7?'Boyun fəqərəsi C'+(i+1):i<19?'Döş fəqərəsi Th'+(i-6):'Bel fəqərəsi L'+(i-18);
  const w=i<7?.05:i<19?.06:.075;
  const m=new THREE.Mesh(new THREE.CylinderGeometry(w,w*1.05,.055,14),mat(BONE));
  put(m,n,reg,V3(0,yy,z),'Vertebra')}
const sac=new THREE.Mesh(new THREE.ConeGeometry(.12,.3,12),mat(BONE));sac.rotation.x=Math.PI;put(sac,'Oma sümüyü (Sacrum)',BB,V3(0,.92,-.12),'Os sacrum');
// Rippen
for(let i=0;i<12;i++){
  const r=.2+.17*Math.sin(((i+1)/12)*Math.PI*.9),arc=Math.PI*1.7;
  const g=new THREE.TorusGeometry(r,.014,8,44,arc);g.rotateZ(-Math.PI/2-arc/2);
  const m=new THREE.Mesh(g,mat(BONE));m.rotation.x=Math.PI/2;m.scale.set(1.15,.85,1);
  put(m,'Qabırğa cütü '+(i+1),BR,V3(0,2.4-i*.085,.02),'Costae')}
const st=new THREE.Mesh(new THREE.BoxGeometry(.07,.6,.03),mat(BONE));put(st,'Döş sümüyü (Sternum)',BR,V3(0,2.12,.33),'Sternum');
[-1,1].forEach(s=>{
  bone('Körpücük sümüyü (Clavicula)',BR,V3(0,2.52,.26),V3(s*.5,2.5,.08),.018,'Clavicula');
  ell('Kürək sümüyü (Scapula)',BR,BONE,V3(s*.4,2.3,-.2),[.16,.21,.025],'Scapula');
  bone('Bazu sümüyü (Humerus)',GL,V3(s*.54,2.46,0),V3(s*.62,1.78,0),.035,'Humerus');
  bone('Şüa sümüyü (Radius)',GL,V3(s*.62,1.76,.02),V3(s*.7,1.12,.1),.025,'Radius');
  ell('Əl sümükləri (Manus)',GL,BONE,V3(s*.72,.98,.1),[.06,.13,.035],'Manus');
  ell('Qalça sümüyü (Os ilium)',BB,BONE,V3(s*.26,.98,0),[.3,.22,.1],'Os ilium');
  bone('Bud sümüyü (Femur)',GL,V3(s*.24,.78,0),V3(s*.3,-.2,.02),.05,'Femur');
  ell('Diz qapağı (Patella)',GL,BONE,V3(s*.3,-.22,.08),[.05,.06,.03],'Patella');
  bone('Qamış sümüyü (Tibia)',GL,V3(s*.3,-.3,.02),V3(s*.3,-1.32,0),.04,'Tibia');
  ell('Ayaq sümükləri (Pes)',GL,BONE,V3(s*.3,-1.42,.12),[.07,.04,.16],'Pes');
  // Organe
  lungs.push(ell('Ağciyər (Pulmo)',BR,0xe8a5a5,V3(s*.2,2.1,.02),[.17,.32,.16],'Pulmo'));
  ell('Böyrək (Ren)',BB,0x8a2a3a,V3(s*.15,1.38,-.1),[.06,.1,.05],'Ren')});
const heart=ell('Ürək (Cor)',BR,0xc4232f,V3(.08,2.0,.14),[.12,.15,.11],'Cor');
ell('Qaraciyər (Hepar)',BB,0x8b3a2f,V3(-.16,1.6,.12),[.24,.11,.13],'Hepar');
ell('Mədə (Gaster)',BB,0xd98a7a,V3(.15,1.56,.13),[.12,.13,.1],'Gaster');
const si=new THREE.Mesh(new THREE.TorusKnotGeometry(.12,.045,120,10,3,4),mat(0xe9a58f));si.scale.set(1,.8,.8);put(si,'Nazik bağırsaq (Intestinum tenue)',BB,V3(0,1.1,.1),'Intestinum tenue');
const co=new THREE.Mesh(new THREE.TorusGeometry(.22,.04,12,40),mat(0xc98577));put(co,'Yoğun bağırsaq (Colon)',BB,V3(0,1.12,.06),'Colon');
ell('Sidik kisəsi (Vesica urinaria)',BB,0xe0c067,V3(0,.76,.12),[.08,.08,.08],'Vesica urinaria');
ell('Dalaq (Splen)',BB,0x7a2e55,V3(.3,1.62,-.05),[.07,.11,.05],'Splen');
ell('Mədəaltı vəzi (Pancreas)',BB,0xe0b070,V3(0,1.45,.03),[.2,.035,.05],'Pancreas');
ell('Öd kisəsi (Vesica biliaris)',BB,0x4a8a3a,V3(-.1,1.5,.2),[.04,.06,.04],'Vesica biliaris');
ell('Qalxanabənzər vəz (Glandula thyroidea)',KH,0xb5543f,V3(0,2.6,.12),[.09,.04,.04],'Glandula thyroidea');
ell('Beyincik (Cerebellum)',KH,0xc98090,V3(0,3.02,-.2),[.16,.1,.12],'Cerebellum');
ell('Diafraqma (Diaphragma)',BR,0xc77a5a,V3(0,1.78,0),[.38,.03,.28],'Diaphragma').userData.mo=.55;
put(new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.85,12),mat(0xd48a8a)),'Qida borusu (Oesophagus)',BR,V3(0,2.12,.02),'Oesophagus');
put(new THREE.Mesh(new THREE.CylinderGeometry(.028,.024,1.2,12),mat(0xb22222)),'Aorta',BR,V3(.04,1.55,-.03),'Aorta');

// Gefäße, Nerven, Muskeln, Details
function tube(name,reg,col,pts,r,sub){const cr=new THREE.CatmullRomCurve3(pts.map(p=>V3(...p)));const g=new THREE.TubeGeometry(cr,48,r,6);g.computeBoundingBox();const c=g.boundingBox.getCenter(V3());g.translate(-c.x,-c.y,-c.z);return put(new THREE.Mesh(g,mat(col)),name,reg,c,sub)}
const RT=0xd42a2a,BL=0x2b5fd9,YL=0xe6c84a;
[-1,1].forEach(s=>{
 tube('Yuxu arteriyası (A. carotis)',KH,RT,[[s*.03,2.2,.05],[s*.1,2.7,.1],[s*.14,3.0,.2],[s*.1,3.3,.2]],.018,'Arteria carotis');
 tube('Bazu arteriyası (A. brachialis)',GL,RT,[[s*.05,2.2,.05],[s*.4,2.45,.05],[s*.58,2.1,.06],[s*.65,1.5,.07],[s*.72,1.05,.1]],.016,'Arteria brachialis');
 tube('Bud arteriyası (A. femoralis)',GL,RT,[[s*.03,1.0,0],[s*.12,.85,.06],[s*.24,.4,.08],[s*.28,-.2,.06],[s*.3,-1.2,.04]],.022,'Arteria femoralis');
 tube('Drossel venası (V. jugularis)',KH,BL,[[s*.09,2.2,.02],[s*.16,2.75,.05],[s*.2,3.05,.1]],.02,'Vena jugularis');
 tube('Qol venası (V. basilica)',GL,BL,[[s*.45,2.4,0],[s*.62,2.0,.04],[s*.7,1.4,.08],[s*.74,1.05,.1]],.014,'Vena basilica');
 tube('Bud venası (V. femoralis)',GL,BL,[[s*.05,1.0,0],[s*.2,.8,.05],[s*.3,.3,.05],[s*.34,-.2,.04],[s*.33,-1.2,.03]],.024,'Vena femoralis');
 tube('Qol sinir kələfi (Plexus brachialis)',GL,YL,[[s*.04,2.55,-.15],[s*.45,2.35,-.05],[s*.6,1.8,-.03],[s*.7,1.1,.08]],.01,'Plexus brachialis');
 tube('Oturacaq siniri (N. ischiadicus)',GL,YL,[[s*.1,1.0,-.15],[s*.2,.7,-.1],[s*.3,.1,-.06],[s*.3,-1.2,-.03]],.012,'Nervus ischiadicus');
 tube('Vaqus siniri (N. vagus)',KH,YL,[[s*.08,3.0,0],[s*.1,2.5,.05],[s*.06,2.0,.1],[s*.05,1.6,.1]],.008,'Nervus vagus');
 ell('Göz alması (Bulbus oculi)',KH,0xf2f2f2,V3(s*.13,3.22,.37),[.055,.055,.055],'Bulbus oculi');
 for(let f=0;f<5;f++){const xf=s*(.66+.02*f),tip=[.8,.74,.72,.75,.8][f];bone('Barmaq sümükləri (Phalanges)',GL,V3(xf,1.04,.1),V3(xf+s*(f-2)*.012,tip,.1),.011,'Phalanges')}
 MU.forEach(m=>ell(m[0],m[2],0xb5444a,V3(s*m[3],m[4],m[5]),[m[6],m[7],m[8]],m[1]).userData.mo=.6)});
tube('Aşağı boş vena (V. cava)',BR,BL,[[-.05,.95,0],[-.06,1.6,0],[-.06,2.1,.05],[-.02,2.3,.08]],.03,'Vena cava');
tube('Onurğa beyni (Medulla spinalis)',BR,YL,[2.9,2.0,1.4,1.0].map(y=>[0,y,-.2+.07*Math.sin((y-1)*1.7)]),.018,'Medulla spinalis');
for(let i=-5;i<=5;i++)[2.96,2.9].forEach((y,k)=>ell('Diş (Dens)',KH,0xf4f1e6,V3(i*.027,y,.31-i*i*.003+(k?.02:0)),[.012,.018,.01],'Dentes'));
(function(){let sd=7;const rn=()=>(sd=(sd*16807)%2147483647)/2147483647;const g=new THREE.Group(),m=mat(RT);
for(let i=0;i<46;i++){const a=rn()*6.28,b=.3+rn()*1.9,pts=[];for(let j=0;j<6;j++){const bb=b+j*.18*(rn()-.2),aa=a+j*.35*(rn()-.5);pts.push(V3(.29*Math.sin(bb)*Math.cos(aa),.32*Math.cos(bb),.32*Math.sin(bb)*Math.sin(aa)))}
g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),20,.004,4),m))}
put(g,'Beyin damarları (Arteriae cerebri)',KH,V3(0,3.22,0),'Arteriae cerebri')})();

// Regionen / Ansichten
const C0=V3(0,1.6,0),FOC={all:1.3,[KH]:3.0,[BR]:2.1,[BB]:1.1,[GL]:1.3};
let region=null,sel=null;const fT=V3(0,1.3,0),fC=V3(0,1.3,0);
const rbox=document.getElementById('regions');
[KH,BR,BB,GL].forEach(r=>{const b=document.createElement('button');b.className='reg';b.textContent=r;b.onclick=()=>{region=region===r?null:r;follow=false;fT.set(0,FOC[region||'all'],0);dist.t=region?4.6:7.6;document.querySelectorAll('.reg').forEach(x=>x.classList.toggle('on',x.textContent===region))};rbox.append(b)});
const show={b:1,o:1,v:1,n:1,m:0};
function mk(t,f,c){const b=document.createElement('button');b.className='reg '+(c||'');b.textContent=t;b.onclick=()=>f(b);rbox.append(b)}
mk('Bütün Bədən',()=>{region=null;follow=false;fT.set(0,1.3,0);dist.t=7.6;if(sel)setEm(sel,0);sel=null;lab.style.display='none';document.querySelectorAll('.reg').forEach(x=>x.classList.remove('on'))});
[['Skelet','b'],['Orqanlar','o'],['Damarlar','v'],['Sinirlər','n'],['Əzələlər','m']].forEach(([t,k])=>{const b=document.createElement('button');b.className='lay'+(show[k]?' on':'');b.textContent=t;b.onclick=()=>{show[k]=show[k]?0:1;b.classList.toggle('on',!!show[k])};rbox.append(b)});

mk('☰ Orqanlar',()=>side.classList.toggle('open'),'tgm');
const VIEWS={Ön:[0,Math.PI/2],Arxa:[Math.PI,Math.PI/2],Yan:[Math.PI/2,Math.PI/2],Perspektiv:[.7,1.25]};
const vb=document.getElementById('views');
Object.keys(VIEWS).forEach((k,i)=>{const b=document.createElement('button');b.className='v'+(i==3?' on':'');b.textContent=k;b.onclick=()=>{th.t=VIEWS[k][0];ph.t=VIEWS[k][1];[...vb.children].forEach(x=>x.classList.toggle('on',x===b))};vb.append(b)});

// Kamera
const th={c:.7,t:.7},ph={c:1.25,t:1.25},dist={c:7.6,t:7.6};
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const cv=renderer.domElement;let drag=null,moved=0;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};moved+=Math.abs(dx)+Math.abs(dy);th.t-=dx*.008;th.c=th.t;ph.t=Math.min(Math.PI-.2,Math.max(.2,ph.t-dy*.008));ph.c=ph.t});
cv.addEventListener('pointerup',e=>{drag=null;if(moved<6)pick(e)});
cv.addEventListener('wheel',e=>{e.preventDefault();dist.t=Math.min(12,Math.max(2,dist.t+e.deltaY*.005))},{passive:false});

// Auswahl
const ray=new THREE.Raycaster(),lab=document.getElementById('label');
function setEm(o,v){o.traverse(m=>{if(m.material)m.material.emissive=new THREE.Color(v)})}
function pick(e){
  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);

const KD={};ORG.forEach(k=>KD[k]='o');Object.keys(INFO).forEach(k=>{if(/^Muscul/.test(k))KD[k]='m';else if(/^(Arteri|Vena)/.test(k))KD[k]='v';else if(/^(Nerv|Plexus|Medulla)/.test(k))KD[k]='n'});
function select(o,fly){
  if(sel)setEm(sel,0);sel=o;setEm(o,0x2a3f99);
  const i=INFO[o.userData.sub]||[o.userData.name,''];
  lab.innerHTML='<b>'+i[0]+'</b><small>'+o.userData.name+' · '+o.userData.region+'</small>'+i[1];lab.style.display='block';
  document.querySelectorAll('.it').forEach(x=>x.classList.toggle('on',x.dataset.k===o.userData.sub));
  if(fly){follow=true;fT.copy(o.position);const s=new THREE.Box3().setFromObject(o).getSize(V3()).length();dist.t=Math.min(7,Math.max(1.5,s*3.2));side.classList.remove('open')}}
const list=document.getElementById('list'),q=document.getElementById('q');
function build(f){list.innerHTML='';Object.keys(INFO).forEach(k=>{const p=parts.find(x=>x.userData.sub===k);if(!p||(f&&!(INFO[k][0]+k).toLowerCase().includes(f)))return;const d=document.createElement('div');d.className='it';d.dataset.k=k;d.innerHTML=INFO[k][0]+'<small>'+k+' · '+p.userData.region+'</small>';d.onclick=()=>{region=null;document.querySelectorAll('.reg').forEach(x=>x.classList.remove('on'));select(p,true)};list.append(d)})}
q.oninput=()=>build(q.value.toLowerCase());build('');

// Explosion
const ex=document.getElementById('ex');let eT=0,eC=0;
ex.oninput=()=>eT=ex.value/100;
document.getElementById('reset').onclick=()=>{eT=0;ex.value=0};

function loop(){
  requestAnimationFrame(loop);
  eC+=(eT-eC)*.12;th.c+=(th.t-th.c)*.1;ph.c+=(ph.t-ph.c)*.1;dist.c+=(dist.t-dist.c)*.1;if(follow&&sel)fT.copy(sel.position);fC.lerp(fT,.08);
  parts.forEach(o=>{
    const b=o.userData.base,d=b.clone().sub(C0);
    o.position.copy(b).addScaledVector(d,eC*1.1);
    const u=o.userData,on=!region||u.region===region,vis=show[KD[u.sub]||'b'];u.vis=vis;const op=on?(u.mo||1):.1;
    o.traverse(m=>{if(m.material){m.material.opacity+=(op-m.material.opacity)*.15}});o.visible=vis});
  const t=performance.now()/1000,k=1+.09*Math.pow(Math.max(0,Math.sin(t*7)),3),br=Math.sin(t*1.6);
  heart.scale.set(.12*k,.15*k,.11*k);lungs.forEach(l=>l.scale.set(.17*(1+.04*br),.32*(1+.07*br),.16*(1+.05*br)));
  cam.position.set(fC.x+dist.c*Math.sin(ph.c)*Math.sin(th.c),fC.y+dist.c*Math.cos(ph.c),fC.z+dist.c*Math.sin(ph.c)*Math.cos(th.c));
  cam.lookAt(fC);renderer.render(scene,cam)}
loop();
