<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Portal | Sefan Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; padding: 10px; }
        .header { background: #1e293b; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; color: #38bdf8; border-radius: 8px; margin-bottom: 15px; border-bottom: 2px solid #0284c7; }
        .search-box { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #fff; margin-bottom: 15px; outline: none; }
        .category-list { display: flex; flex-direction: column; gap: 8px; }
        .cat-item { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 14px; color: #f1f5f9; text-decoration: none; border-radius: 6px; border-left: 4px solid #38bdf8; transition: 0.2s; }
        .cat-item:hover { background: #334155; }
        .counter { background: #0f172a; padding: 3px 8px; border-radius: 12px; font-size: 12px; color: #94a3b8; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

    <div class="header">MÖVZU / FAYL PORTALI</div>

    <input type="text" class="search-box" placeholder="Axtarış et...">

    <div class="category-list">
        <a href="#" class="cat-item">
            <span>🎵 Musiqilər və Meyxanalar</span>
            <span class="counter">1,420</span>
        </a>
        <a href="#" class="cat-item">
            <span>📱 Divar Kağızları (Wallpapers)</span>
            <span class="counter">850</span>
        </a>
        <a href="#" class="cat-item">
            <span>🎬 Videolar və Statuslar</span>
            <span class="counter">610</span>
        </a>
        <a href="#" class="cat-item">
            <span>🎮 Oyunlar və Proqramlar</span>
            <span class="counter">320</span>
        </a>
    </div>

    <div class="footer">
        &copy; 2026 Mobil Portal Sistemləri
    </div>

</body>
</html>
