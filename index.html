<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samir Şiriyev | Rəsmi Səhifə</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            margin: 0 auto 20px;
            border: 4px solid #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .description {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            background: rgba(51, 65, 85, 0.6);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }

        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profil İnisialı / Avatar -->
        <div class="profile-img">SŞ</div>

        <h1>Samir Şiriyev</h1>
        <p class="subtitle">IT Specialist & Content Creator</p>

        <p class="description">
            Şəbəkə sistemləri, texniki həllər və rəqəmsal məzmun istehsalı üzrə şəxsi portfolo və əlaqə səhifəsi.
        </p>

        <div class="links">
            <a href="https://tiktok.com/@samirshiriyev" target="_blank" class="link-btn">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
            <a href="https://github.com/samirshiriyev" target="_blank" class="link-btn">
                <i class="fab fa-github"></i> GitHub Layihələrim
            </a>
            <a href="mailto:contact@samirshiriyev.com" class="link-btn">
                <i class="fas fa-envelope"></i> Əlaqə / E-poçt
            </a>
        </div>

        <div class="footer">
            &copy; 2026 Samir Şiriyev. Bütün hüquqlar qorunur.
        </div>
    </div>

</body>
</html>
